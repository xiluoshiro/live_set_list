    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-body: #171719; --text-heading: #fafafa; --text-main: #eeeef0;
      --text-secondary: #c0c0c7; --text-muted: #a8a8b1;
      --surface-input: #232326; --surface-2: #222225;
      --surface-muted: #2a2a2e; --surface-chip-soft: #39232c;
      --border-soft: #343439; --border-normal: #48484f; --border-strong: #71717a;
      --accent-primary: #ff79aa; --text-on-primary: #171719;
      --status-upcoming: #8abbeb; --status-warning: #edbf71; --status-cancelled: #ff8c8c;

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-body); color: var(--text-main); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button, input, select, a { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .site-topbar { display: flex; align-items: center; gap: 24px; padding: 12px 24px; min-height: 58px; border-bottom: 1px solid var(--border-soft); }
    .site-title { color: var(--text-heading); font-size: 18px; font-weight: 700; white-space: nowrap; }
    .site-navigation { display: flex; flex-wrap: wrap; gap: 24px; color: var(--text-secondary); font-size: 15px; font-weight: 600; }
    .nav-active { color: var(--accent-primary); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
    .theme-button { margin-left: auto; padding: 5px 10px; min-height: 36px; border: 1px solid var(--border-normal); border-radius: 3px; background: transparent; white-space: nowrap; }
    html { scrollbar-gutter: stable; }
    main { width: min(1840px, calc(100% - 96px)); margin: 30px auto 48px; }
    .page-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 3px solid var(--text-heading); }
    .page-heading-main { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 26px; }
    h1 { margin: 0; font-size: clamp(30px, 3.6vw, 48px); font-weight: 760; letter-spacing: -.035em; line-height: 1.24; color: var(--text-heading); }
    .list-scope-toggle { display: flex; gap: 20px; }
    .list-scope-toggle button { border: 0; border-bottom: 2px solid transparent; padding: 8px 0 6px; background: transparent; color: var(--text-muted); font-size: 15px; }
    .list-scope-toggle [aria-pressed="true"] { color: var(--accent-primary); border-bottom-color: var(--accent-primary); font-weight: 700; }
    .scope-count { margin-left: 5px; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .page-heading-search { width: min(440px, 45%); margin-left: auto; }
    .filter-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
    .prototype-note { margin: 0; color: var(--text-muted); font-size: 12px; }
    .prototype-note strong { color: var(--text-secondary); font-weight: 600; }
    .list-filter-panel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 0 0 16px; border-bottom: 1px solid var(--border-soft); }
    .filter-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .filter-field label { color: var(--text-muted); font-size: 13px; }
    .list-filter-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 5px 11px; border: 1px solid var(--border-normal); border-radius: 3px; background: transparent; color: var(--text-secondary); white-space: nowrap; }
    .list-filter-toggle:hover { border-color: var(--border-strong); color: var(--text-heading); }
    .list-filter-toggle::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
    .list-filter-toggle[aria-expanded="true"]::after { transform: translateY(2px) rotate(225deg); }
    .search-controls { display: flex; gap: 8px; }
    input, select { width: 100%; min-width: 0; height: 38px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 2px; background: var(--surface-input); }
    input::placeholder { color: var(--text-muted); }
    .search-button { flex-shrink: 0; height: 38px; padding: 0 13px; border: 1px solid var(--accent-primary); border-radius: 2px; background: var(--accent-primary); color: var(--text-on-primary); font-weight: 600; }
    .result-meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding: 14px 0; color: var(--text-muted); font-size: 13px; }
    .list-active-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .list-active-filters button { padding: 4px 8px; border: 1px solid var(--border-normal); border-radius: 3px; background: var(--surface-chip-soft); color: var(--text-secondary); font-size: 12px; }
    .list-active-filters button:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .list-active-filters .reset-button { border-color: transparent; background: transparent; color: var(--accent-primary); }
    .reset-button { border: 0; background: transparent; padding: 4px 0; color: var(--accent-primary); }
    .live-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px 16px; }
    .live-card { position: relative; min-width: 0; display: grid; grid-template-rows: 32px minmax(54px, auto) minmax(26px, auto) minmax(22px, auto) 32px; gap: 5px; padding: 10px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--bg-body); }
    .live-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
    .live-card:has(.live-card-title a:focus-visible) { outline: 2px solid var(--accent-primary); outline-offset: 3px; }
    .live-card-head { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
    .live-card-date { margin-right: auto; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
    .live-card-badges { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; white-space: nowrap; }
    .live-type, .live-status { display: inline-flex; align-items: center; min-height: 22px; padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    .live-type { background: var(--surface-muted); color: var(--text-secondary); }
    .live-status { background: var(--surface-muted); color: var(--text-secondary); font-weight: 600; }
    [data-status="upcoming"] .live-status { color: var(--status-upcoming); background: var(--status-upcoming-bg); }
    [data-status="postponed"] .live-status { color: var(--status-warning); background: var(--surface-muted); }
    [data-status="cancelled"] .live-status { color: var(--status-cancelled); background: var(--status-cancelled-bg); }
    .live-card-title { margin: 0; min-height: 54px; font-size: 18px; font-weight: 650; line-height: 1.5; color: var(--text-heading); overflow-wrap: anywhere; }
    .live-card-title a { display: block; text-decoration: none; }
    .live-card-title a::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 4px; }
    .live-card:hover .live-card-title a { color: var(--accent-primary); text-decoration: underline; text-underline-offset: 4px; }
    .title-ending { white-space: nowrap; }
    .performers { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; min-height: 26px; }
    .band { display: inline-flex; align-items: center; gap: 5px; min-width: 0; padding: 1px 5px; border: 1px solid var(--border-soft); border-radius: 3px; background: var(--surface-2); font-size: 13px; font-weight: 600; line-height: 1.5; }
    .band img { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; }
    .band-name { white-space: nowrap; }
    .band--icon { position: relative; z-index: 2; padding: 3px; border: 0; background: transparent; }
    .live-location { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; min-height: 21px; color: var(--text-secondary); font-size: 13px; }
    .live-location strong { font-weight: 600; }
    .live-location .venue { min-width: 0; overflow-wrap: anywhere; }
    .live-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .live-collection { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
    .live-collection strong { color: var(--text-main); font-weight: 600; }
    .live-card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .star-btn, .source-button { position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 4px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: var(--text-muted); text-decoration: none; }
    .star-btn { width: 32px; }
    .star-btn[aria-pressed="true"] { color: var(--accent-primary); }
    .star-btn:hover, .source-button:hover { color: var(--accent-primary); border-color: var(--border-normal); }
    .source-button { width: 32px; }
    .action-icon { display: inline-block; width: 17px; height: 17px; flex-shrink: 0; background: currentColor; mask: var(--icon-star) center / contain no-repeat; }
    [aria-pressed="true"] > .action-icon { mask-image: var(--icon-star-fill); }
    .source-button .action-icon { width: 16px; height: 16px; mask-image: var(--icon-external); }
    .empty-state { padding: 48px 0; text-align: center; color: var(--text-muted); }
    dialog { width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - 48px); padding: 24px; border: 1px solid var(--border-normal); border-radius: 4px; background: var(--bg-body); color: var(--text-main); }
    dialog::backdrop { background: rgb(0 0 0 / .32); }
    .dialog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .dialog-head small { color: var(--text-muted); }
    .close-button { padding: 4px 0; border: 0; background: transparent; color: var(--accent-primary); }
    dialog h2 { font-size: 23px; line-height: 1.4; margin: 16px 0; color: var(--text-heading); }
    .detail-meta { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; margin: 0; }
    .detail-meta dt { color: var(--text-muted); }
    .detail-meta dd { margin: 0; overflow-wrap: anywhere; }
    .group-lives { padding: 0; margin: 20px 0 0; list-style: none; }
    .group-lives li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border-normal); }
    .group-lives time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .source-preview { color: var(--text-secondary); line-height: 1.7; }
    @media (max-width: 1100px) {
      .site-navigation { gap: 16px; font-size: 14px; }
      .site-navigation .secondary-nav { display: none; }
      main { width: calc(100% - 64px); }
      .live-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
      .list-filter-panel { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .site-topbar { min-height: 56px; padding: 10px 20px; gap: 12px; }
      .site-title { font-size: 15px; }
      .site-navigation { display: none; }
      .theme-button { font-size: 12px; padding-inline: 8px; }
      main { width: calc(100% - 40px); margin-top: 24px; }
      h1 { font-size: 30px; }
      .page-heading { padding-bottom: 16px; }
      .page-heading-main { gap: 12px 20px; }
      .page-heading-search { width: 100%; }
      .list-filter-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .list-filter-toggle { min-height: 40px; }
      input, select, .search-button { height: 40px; }
    }
    @media (max-width: 640px) {
      .live-card-grid { grid-template-columns: minmax(0, 1fr); }
      .live-card { grid-template-rows: minmax(44px, auto) auto minmax(28px, auto) minmax(24px, auto) 44px; }
      .live-card-title { min-height: 0; }
      .star-btn, .source-button { min-height: 44px; }
      .star-btn { width: 44px; }
      .source-button { width: 44px; }
      .live-card-head { font-size: 12px; }
    }
    @media (max-width: 350px) {
      .site-topbar { padding-inline: 14px; }
      .site-title { font-size: 13px; }
      main { width: calc(100% - 32px); }
      .page-heading-main { gap: 12px 15px; }
      .list-scope-toggle { gap: 15px; }
    }
  </style>
</head>
<body>
  <header class="site-topbar">
    <span class="site-title">BanG Dream! Live 资料库</span>
    <nav class="site-navigation" aria-label="页面位置">
      <span class="nav-active" aria-current="page">演出资料</span><span>巡演资料</span><span>歌曲资料</span><span>数据统计</span><span class="secondary-nav">乐队浏览</span><span class="secondary-nav">联系我们</span>
    </nav>
    <button class="theme-button" id="theme" type="button" aria-label="切换为深色模式">深色</button>
  </header>
  <main id="catalog">
    <header class="page-heading">
      <div class="page-heading-main">
        <h1>演出资料</h1>
        <div class="list-scope-toggle" role="group" aria-label="内容范围">
          <button type="button" data-scope="all" aria-pressed="true">全部<span class="scope-count" id="all-count">12</span></button>
          <button type="button" data-scope="favorites" aria-pressed="false">仅收藏<span class="scope-count" id="favorite-count">2</span></button>
        </div>
      </div>
      <form class="search-controls page-heading-search" id="search" role="search" aria-label="搜索演出">
        <input id="keyword" type="search" aria-label="关键词" placeholder="搜索 Live、乐队或场馆"><button class="search-button" type="submit">搜索</button>
      </form>
    </header>
    <div class="filter-toolbar">
      <p class="prototype-note" title="场馆、时刻与歌单情况为示意；收藏和筛选仅在本示例中生效。"><strong>布局示例</strong> · 补充资料为示意</p>
      <button class="list-filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">展开筛选</button>
    </div>
    <form class="list-filter-panel" id="filters" aria-label="筛选演出" hidden>
      <div class="filter-field"><label for="year">年份</label><select id="year"><option value="">全部年份</option><option>2027</option><option>2026</option></select></div>
      <div class="filter-field"><label for="band">乐队 / 艺人</label><select id="band"><option value="">全部乐队</option></select></div>
      <div class="filter-field"><label for="type">Live 类型</label><select id="type"><option value="">全部类型</option><option>专场</option><option>活动</option><option>音乐节</option><option>对邦</option><option>单日多场</option><option>多日活动</option></select></div>
      <div class="filter-field"><label for="status">状态</label><select id="status"><option value="">全部状态</option><option value="upcoming">待举行</option><option value="past">已结束</option><option value="cancelled">已取消</option></select></div>
      <div class="filter-field"><label for="sort">排序</label><select id="sort"><option value="new">日期：新 → 旧</option><option value="old">日期：旧 → 新</option></select></div>
    </form>
    <div class="result-meta"><div class="list-active-filters" id="active-filters" aria-label="当前筛选" hidden></div><span id="result-count" aria-live="polite" aria-atomic="true"></span></div>
    <section class="live-card-grid" id="cards" aria-label="演出列表"></section>
    <p class="empty-state" id="empty" hidden>没有符合条件的演出</p>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head"><small id="detail-kind">演出摘要</small><button class="close-button" type="button" id="close-detail">关闭</button></div>
    <h2 id="detail-title"></h2><div id="detail-body"></div>
  </dialog>
  <script>
    'use strict';
    // Titles mirror the supplied screenshot. Supplementary values and past cases

        <div class="performers" aria-label="出演">${performersHTML(item.bands, item.id)}</div>
        <div class="live-location"><strong>${escapeHTML(item.city)}</strong><span aria-hidden="true">·</span><span class="venue">${escapeHTML(item.venue)}</span></div>
        <div class="live-card-footer"><span class="live-collection">${collectionText(item)}</span><button class="source-button" type="button" data-source="${item.id}" title="资料来源" aria-haspopup="dialog" aria-label="查看 ${escapeHTML(item.title)} 的资料来源示例"><span class="action-icon" aria-hidden="true"></span></button></div>
      </article>`).join('');
      document.getElementById('result-count').textContent = `找到 ${results.length} 条演出资料`;
      document.getElementById('empty').hidden = results.length !== 0;
      const selectedFilters = [
        ['keyword', query ? `关键词：${query}` : ''],
        ['year', year], ['band', band ? bandCatalog[band].name : ''], ['type', type],
        ['status', status ? document.getElementById('status').selectedOptions[0].text : ''],
        ['sort', sort === 'old' ? '日期：旧 → 新' : '']
      ].filter(([, value]) => value);
      const activeFilters = document.getElementById('active-filters');
      activeFilters.hidden = selectedFilters.length === 0;
      activeFilters.innerHTML = selectedFilters.map(([key, label]) => `<button type="button" data-clear-filter="${key}" aria-label="移除筛选 ${escapeHTML(label)}">${escapeHTML(label)} <span aria-hidden="true">×</span></button>`).join('') + (selectedFilters.length ? '<button class="reset-button" id="reset" type="button">清除全部</button>' : '');
      updateScopeCounts();
      updateFilterState();
    }
    function updateScopeCounts() {
      document.getElementById('all-count').textContent = performances.length;
      document.getElementById('favorite-count').textContent = favorites.size;
    }
    function updateFilterState() {
      filters.hidden = !filtersExpanded;
      const button = document.getElementById('filter-toggle');
      const count = [document.getElementById('year').value, document.getElementById('band').value, document.getElementById('type').value, document.getElementById('status').value, document.getElementById('sort').value === 'old'].filter(Boolean).length;
      button.textContent = `${filtersExpanded ? '收起筛选' : '展开筛选'}${count ? ` (${count})` : ''}`;
      button.setAttribute('aria-expanded', String(filtersExpanded));
    }
    function openDetail(item, source = false) {
      document.getElementById('detail-kind').textContent = source ? '资料来源 · 示例' : item.shows ? '活动组摘要 · 示例' : '演出摘要 · 示例';
      document.getElementById('detail-title').textContent = item.title;
      document.getElementById('detail-body').innerHTML = source ? '<p class="source-preview">这里对应正式页面的资料来源入口。本示例使用布局数据，未绑定演出官网链接。</p>' : `<dl class="detail-meta"><dt>日期</dt><dd>${formatDate(item)}</dd><dt>类型 / 状态</dt><dd>${item.type} · ${item.status}</dd><dt>出演</dt><dd>${item.bands.map(id => escapeHTML(bandCatalog[id].name)).join(' / ')}</dd><dt>地点</dt><dd>${escapeHTML(item.city)} · ${escapeHTML(item.venue)}</dd><dt>${item.shows ? '场次' : item.tone === 'past' ? '歌单' : '时间'}</dt><dd>${collectionText(item)}</dd></dl>${item.shows ? `<ul class="group-lives" aria-label="收录场次">${item.shows.map(show => `<li><span>${show.name}</span><time>${show.date} · ${show.time}</time></li>`).join('')}</ul>` : ''}`;
      dialog.showModal();
    }
    search.addEventListener('submit', event => { event.preventDefault(); query = document.getElementById('keyword').value.trim(); render(); });
    filters.addEventListener('submit', event => event.preventDefault());
    filters.addEventListener('change', event => { if (event.target.matches('select')) render(); });
    document.getElementById('filter-toggle').addEventListener('click', () => { filtersExpanded = !filtersExpanded; updateFilterState(); });
    document.getElementById('keyword').addEventListener('input', event => { if (!event.target.value && query) { query = ''; render(); } });
    document.getElementById('active-filters').addEventListener('click', event => {
      if (event.target.closest('#reset')) { filters.reset(); search.reset(); query = ''; render(); document.getElementById('keyword').focus(); return; }
      const clear = event.target.closest('[data-clear-filter]');
      if (!clear) return;
      const field = clear.dataset.clearFilter;
      document.getElementById(field).value = field === 'sort' ? 'new' : '';
      if (field === 'keyword') query = '';
      render(); const target = document.getElementById(field); (target.getClientRects().length ? target : document.getElementById('keyword')).focus();
    });
    document.querySelectorAll('[data-scope]').forEach(button => button.addEventListener('click', () => { scope = button.dataset.scope; document.querySelectorAll('[data-scope]').forEach(other => other.setAttribute('aria-pressed', String(other === button))); render(); }));
    cards.addEventListener('click', event => {
      const favorite = event.target.closest('[data-favorite]');
      if (favorite) {
        const id = Number(favorite.dataset.favorite);
        favorites.has(id) ? favorites.delete(id) : favorites.add(id);
        if (scope === 'favorites') { render(); document.querySelector('[data-scope="favorites"]').focus(); }
        else { const item = byId.get(id); favorite.setAttribute('aria-pressed', String(favorites.has(id))); favorite.setAttribute('aria-label', `${favorites.has(id) ? '取消收藏' : '加入收藏'} ${item.title}`); favorite.title = favorites.has(id) ? '取消收藏' : '加入收藏'; updateScopeCounts(); }
        return;
      }
      const detail = event.target.closest('[data-detail]');
      const source = event.target.closest('[data-source]');
      if (detail || source) { event.preventDefault(); openDetail(byId.get(Number(detail ? detail.dataset.detail : source.dataset.source)), Boolean(source)); }
    });
    document.getElementById('close-detail').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { const rect = dialog.getBoundingClientRect(); if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) dialog.close(); });
    function setTheme(dark) { document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.getElementById('theme').textContent = dark ? '浅色' : '深色'; document.getElementById('theme').setAttribute('aria-label', dark ? '切换为浅色模式' : '切换为深色模式'); }
    document.getElementById('theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'));
    setTheme(matchMedia('(prefers-color-scheme: dark)').matches);
    render();
  </script>
</body>
</html>
