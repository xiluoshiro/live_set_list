<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LiveSetList 演出详情方向探索：双主题舞台灯光歌单与 Band 彩色时间线。"
    />
    <title>STAGE LIGHT 歌单 | LiveSetList</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("live-setlist-program-notes-theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch {
        // 静态预览在禁用存储时仍默认使用夜间模式。
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f4e8ee;
        --page-deep: #ead8e1;
        --sheet: #fffafb;
        --sheet-muted: #faf1f5;
        --ink: #242229;
        --soft: #6d646b;
        --cobalt: #2158c5;
        --cobalt-dark: #174398;
        --rule: #b8aeb4;
        --rule-soft: #ded2d8;
        --shadow: 0 1.8rem 5rem rgb(92 54 75 / 0.16);
        font-family:
          "Yu Mincho", "Hiragino Mincho ProN", "Iowan Old Style", Baskerville,
          "Noto Serif SC", serif;
        color: var(--ink);
        background: var(--page);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        scroll-behavior: smooth;
        scroll-padding-top: 1rem;
        background: var(--page);
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--page);
      }

      button,
      a {
        color: inherit;
        font: inherit;
      }

      button {
        border-radius: 0;
      }

      a {
        text-underline-offset: 0.22em;
      }

      [hidden] {
        display: none !important;
      }

      .topline {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: 4rem;
        padding: 0.75rem clamp(1rem, 3vw, 2.75rem);
        border-bottom: 1px solid var(--rule);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.78rem;
      }

      .topline strong {
        color: var(--cobalt);
        font-size: 0.94rem;
        letter-spacing: -0.035em;
      }

      .topline span {
        color: var(--soft);
      }

      .topline a {
        justify-self: end;
      }

      .topline a:focus-visible,
      .source-link:focus-visible,
      .contents a:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 4px;
      }

      .scenario-bar {
        display: grid;
        grid-template-columns: minmax(12rem, 0.55fr) minmax(0, 1.45fr);
        gap: 2rem;
        align-items: center;
        max-width: 1440px;
        margin: 0 auto;
        padding: 1.25rem clamp(1rem, 3vw, 2.75rem);
        border-right: 1px solid var(--rule);
        border-left: 1px solid var(--rule);
        background: color-mix(in srgb, var(--sheet) 46%, var(--page));
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
      }

      .scenario-copy strong,
      .scenario-copy span {
        display: block;
      }

      .scenario-copy strong {
        margin-bottom: 0.28rem;
        font-size: 0.76rem;
      }

      .scenario-copy span {
        max-width: 34rem;
        color: var(--soft);
        font-size: 0.7rem;
        line-height: 1.5;
      }

      .scenario-tabs {
        display: grid;
        grid-template-columns: repeat(6, minmax(7rem, 1fr));
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        border-left: 1px solid var(--rule);
        scrollbar-color: var(--rule) transparent;
        scrollbar-width: thin;
      }

      .scenario-tabs::-webkit-scrollbar {
        height: 0.35rem;
      }

      .scenario-tabs::-webkit-scrollbar-thumb {
        background: var(--rule);
      }

      .scenario-tabs button {
        min-height: 3.25rem;
        padding: 0.55rem 0.7rem;
        border: 0;
        border-top: 1px solid var(--rule);
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        color: var(--soft);
        text-align: left;
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
      }

      .scenario-tabs button span {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.64rem;
      }

      .scenario-tabs button[aria-selected="true"] {
        color: var(--sheet);
        background: var(--cobalt);
      }

      .scenario-tabs button:hover:not([aria-selected="true"]) {
        color: var(--ink);
        background: var(--sheet);
      }

      .scenario-tabs button:focus-visible {
        position: relative;
        z-index: 1;
        outline: 3px solid var(--cobalt);
        outline-offset: -3px;
      }

      .book {
        max-width: 1380px;
        margin: clamp(1rem, 3vw, 3rem) auto;
        overflow: clip;
        border: 1px solid var(--rule);
        background: var(--sheet);
        box-shadow: var(--shadow);
        transition:
          opacity 180ms ease,
          transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .book.is-switching {
        opacity: 0;
        transform: translateY(0.65rem);
      }

      .cover {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(19rem, 0.55fr);
        min-height: 29rem;
        border-bottom: 1px solid var(--ink);
      }

      .cover-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
        padding: clamp(2rem, 5vw, 5rem);
        border-right: 1px solid var(--ink);
      }

      .series {
        margin: 0;
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.76rem;
        font-weight: 750;
      }

      .cover h1 {
        max-width: 16ch;
        margin: 2.4rem 0;
        font-size: clamp(3.15rem, 6.4vw, 7.5rem);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 0.92;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }

      .cover-summary {
        max-width: 39rem;
        margin: 0;
        color: var(--soft);
        font-size: 0.94rem;
        line-height: 1.7;
      }

      .reference-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem 1rem;
        margin-top: 1.25rem;
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.69rem;
      }

      .reference-list span {
        padding-left: 0.65rem;
        border-left: 2px solid var(--cobalt);
      }

      .cover-register {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 2rem;
        padding: clamp(1.5rem, 3vw, 3rem);
        color: var(--cobalt);
        background: var(--sheet-muted);
      }

      .date-block {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.8rem;
        align-items: end;
      }

      .date-day {
        margin: 0;
        font-size: clamp(3.6rem, 6vw, 7rem);
        font-weight: 400;
        letter-spacing: -0.07em;
        line-height: 0.78;
      }

      .date-year {
        margin: 0;
        padding-bottom: 0.1rem;
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.72rem;
        line-height: 1.5;
      }

      .register-data {
        margin: 0;
        color: var(--ink);
      }

      .register-data div {
        display: grid;
        grid-template-columns: 4.4rem minmax(0, 1fr);
        gap: 0.8rem;
        padding: 0.72rem 0;
        border-top: 1px solid var(--rule);
      }

      .register-data dt {
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.67rem;
      }

      .register-data dd {
        margin: 0;
        font-size: 0.91rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .cover-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
      }

      .cover-actions button,
      .source-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.55rem 0.85rem;
        border: 1px solid var(--ink);
        text-decoration: none;
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
      }

      .cover-actions button + button {
        border-left: 0;
      }

      .cover-actions .favorite {
        border-color: var(--cobalt);
        color: var(--sheet);
        background: var(--cobalt);
      }

      .cover-actions .favorite[aria-pressed="true"] {
        color: var(--cobalt);
        background: transparent;
      }

      .cover-actions button:hover,
      .source-link:hover {
        color: var(--sheet);
        background: var(--ink);
      }

      .cover-actions button:active,
      .source-link:active {
        transform: translateY(1px);
      }

      .cover-actions button:focus-visible {
        position: relative;
        z-index: 1;
        outline: 3px solid var(--cobalt);
        outline-offset: 3px;
      }

      .source-link {
        grid-column: 1 / -1;
        border-top: 0;
        color: var(--cobalt);
      }

      .status-panel {
        display: grid;
        grid-template-columns: minmax(8rem, 0.28fr) minmax(0, 0.72fr);
        border-bottom: 1px solid var(--ink);
        background: var(--page-deep);
      }

      .status-title,
      .status-copy {
        padding: 1.5rem clamp(1.25rem, 3vw, 2.5rem);
      }

      .status-title {
        border-right: 1px solid var(--ink);
      }

      .status-title strong {
        display: block;
        color: var(--cobalt);
        font-size: clamp(1.7rem, 3vw, 3.4rem);
        font-weight: 500;
        letter-spacing: -0.045em;
      }

      .status-title span {
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.68rem;
      }

      .status-copy {
        align-self: center;
      }

      .status-copy p {
        max-width: 50rem;
        margin: 0;
        line-height: 1.65;
      }

      .history-list {
        display: grid;
        gap: 0.4rem;
        margin: 0.9rem 0 0;
        padding: 0;
        list-style: none;
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.72rem;
      }

      .history-list li {
        padding-left: 0.7rem;
        border-left: 2px solid var(--cobalt);
      }

      .reading-layout {
        display: grid;
        grid-template-columns: minmax(10rem, 0.2fr) minmax(28rem, 0.55fr) minmax(15rem, 0.25fr);
        min-height: 42rem;
      }

      .contents,
      .notes {
        min-width: 0;
        background: var(--sheet-muted);
      }

      .contents {
        border-right: 1px solid var(--rule);
      }

      .contents-inner,
      .notes-inner {
        position: sticky;
        top: 0;
        padding: 2rem 1.25rem;
      }

      .notes-inner {
        max-height: 100vh;
        overflow-y: auto;
        scrollbar-color: var(--rule) transparent;
        scrollbar-width: thin;
      }

      .contents h2,
      .notes-label {
        margin: 0 0 1.5rem;
        color: var(--cobalt);
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.04em;
      }

      .contents nav {
        display: grid;
      }

      .contents a {
        display: grid;
        grid-template-columns: 3.2rem minmax(0, 1fr);
        gap: 0.55rem;
        padding: 0.72rem 0;
        border-top: 1px solid var(--rule-soft);
        text-decoration: none;
      }

      .contents a:hover {
        color: var(--cobalt);
      }

      .contents a span {
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.64rem;
      }

      .contents a strong {
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .contents-summary {
        margin: 2rem 0 0;
        padding-top: 0.85rem;
        border-top: 1px solid var(--ink);
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.67rem;
        line-height: 1.55;
      }

      .program {
        min-width: 0;
        padding: 2rem clamp(1.5rem, 3.5vw, 3.5rem) 5rem;
      }

      .program-head {
        display: grid;
        gap: 0.75rem;
        padding-bottom: 1.75rem;
      }

      .program-head h2 {
        margin: 0;
        color: var(--cobalt);
        font-size: clamp(3.4rem, 6.5vw, 7rem);
        font-weight: 400;
        letter-spacing: -0.07em;
        line-height: 0.88;
      }

      .program-head p {
        max-width: 38rem;
        margin: 0;
        color: var(--soft);
        font-size: 0.88rem;
        line-height: 1.6;
      }

      .chapter {
        scroll-margin-top: 1rem;
        display: grid;
        grid-template-columns: 4rem minmax(0, 1fr);
        gap: 1rem;
        padding: 2rem 0 2.5rem;
        border-top: 1px solid var(--ink);
      }

      .chapter-mark {
        color: var(--cobalt);
        font-size: clamp(2.1rem, 3.8vw, 4rem);
        font-style: italic;
        line-height: 1.1;
        padding-bottom: 0.15rem;
      }

      .chapter-main {
        min-width: 0;
      }

      .chapter-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        align-items: start;
        margin-bottom: 1.45rem;
      }

      .chapter-head h3 {
        margin: 0;
        font-size: clamp(1.35rem, 2.5vw, 2.25rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .chapter-head p {
        margin: 0.4rem 0 0;
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.68rem;
      }

      .chapter-range {
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.68rem;
        white-space: nowrap;
      }

      .tracks {
        display: grid;
        gap: 0.25rem;
      }

      .track {
        min-width: 0;
      }

      .track-main {
        display: grid;
        grid-template-columns: 3.25rem minmax(0, 1fr) minmax(8rem, 0.62fr) auto;
        gap: 0.8rem;
        align-items: baseline;
        width: 100%;
        min-height: 3.4rem;
        padding: 0.7rem 0.65rem;
        border: 0;
        color: var(--ink);
        text-align: left;
        background: transparent;
        cursor: pointer;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          transform 160ms ease;
      }

      .track-main:hover,
      .track-main[aria-expanded="true"] {
        color: var(--cobalt-dark);
        background: var(--sheet-muted);
      }

      .track-main:active {
        transform: translateY(1px);
      }

      .track-main:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 2px;
      }

      .track-code {
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.7rem;
        font-weight: 750;
      }

      .track-title {
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .track-performer {
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.67rem;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .track-more {
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.62rem;
        white-space: nowrap;
      }

      .track-main[aria-expanded="true"] .track-more {
        color: var(--cobalt);
      }

      .track-inline-detail {
        margin: 0 0 0.65rem 4rem;
        padding: 0.85rem;
        border-left: 2px solid var(--cobalt);
        background: var(--sheet-muted);
      }

      .detail-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-top: 0.75rem;
      }

      .detail-tag {
        padding: 0.18rem 0.4rem;
        border: 1px solid var(--cobalt);
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.62rem;
      }

      .detail-copy {
        margin: 0;
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.72rem;
        line-height: 1.6;
      }

      .detail-copy + .detail-copy {
        margin-top: 0.55rem;
      }

      .roster-summary {
        margin: 0.8rem 0 0;
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.72rem;
        line-height: 1.6;
      }

      .roster-disclosure {
        margin-top: 0.75rem;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
      }

      .roster-disclosure summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.75rem;
        align-items: center;
        min-height: 2.8rem;
        padding: 0.65rem 0;
        color: var(--cobalt);
        font-size: 0.69rem;
        font-weight: 750;
        cursor: pointer;
        list-style: none;
      }

      .roster-disclosure summary::-webkit-details-marker {
        display: none;
      }

      .roster-disclosure summary::after {
        content: "＋";
        font-size: 1rem;
        font-weight: 400;
        transition: transform 180ms ease;
      }

      .roster-disclosure[open] summary::after {
        transform: rotate(45deg);
      }

      .roster-disclosure summary:focus-visible {
        outline: 2px solid var(--cobalt);
        outline-offset: 3px;
      }

      .roster-list {
        display: grid;
        gap: 0;
        margin: 0;
        padding: 0 0 0.75rem;
        list-style: none;
        counter-reset: roster;
      }

      .roster-list li {
        counter-increment: roster;
        display: grid;
        grid-template-columns: 2rem minmax(0, 1fr);
        gap: 0.5rem;
        min-width: 0;
        padding: 0.58rem 0;
        border-top: 1px solid var(--rule-soft);
      }

      .roster-list li::before {
        content: counter(roster, decimal-leading-zero);
        color: var(--cobalt);
        font-size: 0.6rem;
        font-variant-numeric: tabular-nums;
      }

      .roster-entry {
        display: grid;
        gap: 0.18rem;
        min-width: 0;
      }

      .roster-entry strong {
        color: var(--ink);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif SC", serif;
        font-size: 0.78rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .roster-entry span {
        color: var(--soft);
        font-size: 0.62rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .track-inline-detail .roster-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 1.25rem;
      }

      .notes {
        border-left: 1px solid var(--rule);
      }

      .notes-code {
        margin: 0 0 0.8rem;
        color: var(--cobalt);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.7rem;
        font-weight: 750;
      }

      .notes h3 {
        margin: 0;
        font-size: clamp(1.35rem, 2.2vw, 2.1rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .notes-rule {
        width: 3rem;
        margin: 1.25rem 0;
        border: 0;
        border-top: 2px solid var(--cobalt);
      }

      .notes-body {
        color: var(--soft);
        font-size: 0.82rem;
        line-height: 1.65;
      }

      .notes-body p {
        margin: 0;
      }

      .notes-body p + p {
        margin-top: 0.65rem;
      }

      .empty-program {
        display: grid;
        grid-template-columns: minmax(10rem, 0.2fr) minmax(0, 0.8fr);
        min-height: 26rem;
      }

      .empty-index {
        padding: 2rem 1.25rem;
        border-right: 1px solid var(--rule);
        color: var(--cobalt);
        background: var(--sheet-muted);
      }

      .empty-index strong {
        display: block;
        font-size: 0.75rem;
      }

      .empty-index span {
        display: block;
        margin-top: 0.5rem;
        color: var(--soft);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
        font-size: 0.68rem;
        line-height: 1.5;
      }

      .empty-copy {
        align-self: center;
        max-width: 48rem;
        padding: clamp(2rem, 6vw, 6rem);
      }

      .empty-copy h2 {
        max-width: 15ch;
        margin: 0;
        color: var(--cobalt);
        font-size: clamp(2.8rem, 6vw, 6rem);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 0.95;
      }

      .empty-copy > p {
        max-width: 38rem;
        margin: 1.5rem 0 0;
        color: var(--soft);
        line-height: 1.7;
      }

      .attendees {
        display: grid;
        gap: 0.75rem;
        max-width: 38rem;
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--ink);
      }

      .attendee {
        display: grid;
        grid-template-columns: minmax(8rem, 0.35fr) minmax(0, 0.65fr);
        gap: 1rem;
      }

      .attendee strong {
        font-size: 0.82rem;
      }

      .attendee span {
        color: var(--soft);

      const bandVisuals = {
        "Poppin'Party": { color: "#ff3377" },
        Afterglow: { color: "#e83848" },
        "Pastel＊Palettes": { color: "#33ddaa" },
        Roselia: { color: "#3344aa" },
        "ハロー、ハッピーワールド！": { color: "#f4b600" },
        "RAISE A SUILEN": { color: "#22cccc" },
        Morfonica: { color: "#2dc1f7" },
        "MyGO!!!!!": { color: "#3388bb" },
        "Ave Mujica": { color: "#881144" },
        "夢限大みゅーたいぷ": { color: "#ec7384" },
      };

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function bandColor(name) {
        return bandVisuals[name]?.color ?? "#244fc9";
      }

      function railPalette(track, scenario) {
        const axisBands = scenario.axisBands ?? [];
        const scenarioPerformers = axisBands.filter((band) => track.performers.includes(band));
        const otherPerformers = track.performers.filter((band) => !axisBands.includes(band));
        const orderedPerformers = scenarioPerformers.length > 0
          ? [...scenarioPerformers, ...otherPerformers]
          : track.performers;
        return [...new Set(orderedPerformers.map(bandColor))];
      }

      function spectrumRail(colors) {
        return `linear-gradient(90deg, ${colors
          .map((color, index) => {
            const position = (100 * index) / Math.max(1, colors.length - 1);
            return `${color} ${position.toFixed(2)}%`;
          })
          .join(", ")})`;
      }

      function bandRailMarkup(track, scenario) {
        const colors = railPalette(track, scenario);
        const isSpectrum = colors.length >= 5;

        if (isSpectrum) {
          return `
            <span
              class="track-rail is-spectrum"
              style="--rail-spectrum:${spectrumRail(colors)}"
              aria-hidden="true"
            >
              <span class="track-rail-spectrum"></span>
            </span>
          `;
        }

        const lanes = colors
          .map((color, index) => {
            const laneWidth = 100 / colors.length;
            const laneLeft = laneWidth * index;
            return `
              <span
                class="track-rail-core"
                style="--lane-color:${color};--lane-left:${laneLeft.toFixed(2)}%;--lane-width:${laneWidth.toFixed(2)}%"
              ></span>
            `;
          })
          .join("");

        return `
          <span class="track-rail" aria-hidden="true">
            ${lanes}
          </span>
        `;
      }

      function renderBandLegend(scenario) {
        const names = [];
        let hasSpectrumTrack = false;
        scenario.chapters.forEach((chapter) => {
          chapter.songs.forEach((track) => {
            if (railPalette(track, scenario).length >= 5) hasSpectrumTrack = true;
            track.performers.forEach((performer) => {
              if (!names.includes(performer)) names.push(performer);
            });
          });
        });
        const orderedNames = scenario.axisBands
          ? [
              ...scenario.axisBands,
              ...names.filter((name) => !scenario.axisBands.includes(name)),
            ]
          : names;
        elements.bandLegend.innerHTML = `
          <p>Band timeline</p>
          <ul>
            ${orderedNames
              .map(
                (name) => `
                  <li>
                    <span class="band-legend-line" style="--band-color:${bandColor(name)}" aria-hidden="true"></span>
                    <span>${escapeHtml(name)}</span>
                  </li>
                `,
              )
              .join("")}
          </ul>
          ${scenario.axisBands
            ? `
              <div class="band-legend-segments">
                <span class="band-legend-segment-rail" aria-hidden="true">
                  <i style="--segment-color:${bandColor(scenario.axisBands[0])}"></i>
                  <i style="--segment-color:${bandColor(scenario.axisBands[1])}"></i>
                </span>
                <span>相邻曲目仅连接同序号色轨，其余色轨在曲目间断开。</span>
              </div>
            `
            : ""}
          ${hasSpectrumTrack
            ? `
              <div class="band-legend-segments">
                <span class="band-legend-spectrum-rail" aria-hidden="true"></span>
                <span>5 组以上合并为彩虹轨道，表示大型联合出演。</span>
              </div>
            `
            : ""}
        `;
      }

      function songCount(scenario) {
        return scenario.chapters.reduce((total, chapter) => total + chapter.songs.length, 0);
      }

      function performerSummary(performers) {
        if (performers.length === 1) return performers[0];
        if (performers.length === 2) return performers.join(" + ");
        return `${performers.length} 组联合出演`;
      }

      const collaborationLabels = {
        "internal-2": {
          short: "内部 2 组",
          label: "内部两组合唱",
        },
        "internal-3-4": {
          short: "内部 3-4 组",
          label: "内部 3-4 组合唱",
        },
        "internal-all": {
          short: "内部全员",
          label: "内部全员合唱",
        },
        "external-2": {
          short: "外部 2 组",
          label: "外部两组合唱",
        },
        "external-all": {
          short: "外部全员",
          label: "外部全员合唱",
        },
      };

      function collaborationSpec(track) {
        if (track.collaboration && collaborationLabels[track.collaboration]) {
          return collaborationLabels[track.collaboration];
        }
        if (track.performers.length === 2) return collaborationLabels["internal-2"];
        if (track.performers.length >= 3 && track.performers.length <= 4) {
          return collaborationLabels["internal-3-4"];
        }
        if (track.performers.length >= 5) return collaborationLabels["internal-all"];
        return null;
      }

      function rosterListMarkup(items) {
        const rows = items
          .map((item) => {
            const values = Array.isArray(item.value)
              ? item.value
              : item.value
                ? [item.value]
                : [];
            const members = values.length > 0
              ? `<span>${escapeHtml(values.join(" / "))}</span>`
              : "";
            return `
              <li>
                <span class="roster-entry">
                  <strong>${escapeHtml(item.key)}</strong>
                  ${members}
                </span>
              </li>
            `;
          })
          .join("");
        return `<ol class="roster-list">${rows}</ol>`;
      }

      function performerMarkup(performers) {
        if (performers.length <= 3) {
          return `<p class="detail-copy"><strong>演出 Band：</strong>${escapeHtml(performers.join(" / "))}</p>`;
        }

        const preview = performers.slice(0, 2).join(" / ");
        const items = performers.map((performer) => ({ key: performer, value: [] }));
        return `
          <p class="roster-summary">
            <strong>演出 Band：</strong>${escapeHtml(preview)}，另 ${performers.length - 2} 组
          </p>
          <details class="roster-disclosure">
            <summary><span>展开完整演出 Band（${performers.length} 组）</span></summary>
            ${rosterListMarkup(items)}
          </details>
        `;
      }

      function collaborationMarkup(track) {
        const spec = collaborationSpec(track);
        if (!spec) return "";
        return `<p class="collaboration-spec"><strong>合唱规格：</strong>${escapeHtml(spec.label)}</p>`;
      }

      function lineupTransitionMarkup(track) {
        const transition = track.lineupTransition;
        if (!transition) return "";
        return `
          <section class="lineup-transition" aria-label="阵容交接">
            <div class="lineup-transition-formula">
              <span>
                <strong>${escapeHtml(transition.baseCount)}</strong>
                <small>${escapeHtml(transition.base)} 基准</small>
              </span>
              <b aria-hidden="true">+</b>
              <span>
                <strong>${escapeHtml(transition.incomingCount)}</strong>
                <small>${escapeHtml(transition.next)} 新成员</small>
              </span>
            </div>
            <p><strong>先行加入：</strong>${escapeHtml(transition.incoming)}</p>
            <p>${escapeHtml(transition.followup)}</p>
          </section>
        `;
      }

      function otherMemberMarkup(otherMembers = []) {
        if (otherMembers.length === 0) return "";

        const nestedMemberCount = otherMembers.reduce((total, item) => {
          const values = Array.isArray(item.value)
            ? item.value
            : item.value
              ? [item.value]
              : [];
          return total + values.length;
        }, 0);
        const shouldCollapse = otherMembers.length > 3 || nestedMemberCount > 8;

        if (!shouldCollapse) {
          const names = otherMembers
            .map((item) => {
              const values = Array.isArray(item.value)
                ? item.value
                : item.value
                  ? [item.value]
                  : [];
              return values.length > 0
                ? `${item.key}（${values.join(" / ")}）`
                : item.key;
            })
            .join(" / ");
          return `<p class="detail-copy"><strong>其他出演：</strong>${escapeHtml(names)}</p>`;
        }

        const preview = otherMembers.slice(0, 2).map((item) => item.key).join(" / ");
        const remainder = otherMembers.length > 2
          ? `，另 ${otherMembers.length - 2} 组`
          : nestedMemberCount > 0
            ? `，共列 ${nestedMemberCount} 名成员`
            : "";
        return `
          <p class="roster-summary">
            <strong>其他出演：</strong>${escapeHtml(preview)}${escapeHtml(remainder)}
          </p>
          <details class="roster-disclosure">
            <summary><span>展开完整其他出演名录（${otherMembers.length} 组）</span></summary>
            ${rosterListMarkup(otherMembers)}
          </details>
        `;
      }

      function detailBodyMarkup(track) {
        const noteLine = track.note
          ? `<p class="detail-copy">${escapeHtml(track.note)}</p>`
          : (track.otherMembers ?? []).length === 0
            ? `<p class="detail-copy">本条没有额外阵容或版本备注。</p>`
            : "";
        return [
          lineupTransitionMarkup(track),
          collaborationMarkup(track),
          performerMarkup(track.performers),
          noteLine,
          otherMemberMarkup(track.otherMembers),
        ].join("");
      }

      function detailMarkup(track) {
        const tags = (track.tags ?? [])
          .map((tag) => `<span class="detail-tag">${escapeHtml(tag)}</span>`)
          .join("");
        return `${detailBodyMarkup(track)}${tags ? `<div class="detail-tags">${tags}</div>` : ""}`;
      }

      function renderNotes(track) {
        if (!track) {
          elements.notesCode.textContent = "";
          elements.notesTitle.textContent = "";
          elements.notesBody.innerHTML = "";
          elements.notesTags.innerHTML = "";
          return;
        }

        elements.notesCode.textContent = track.code;
        elements.notesTitle.textContent = track.title;
        elements.notes.style.setProperty("--detail-color", bandColor(track.performers[0]));
        elements.notesBody.innerHTML = detailBodyMarkup(track);
        elements.notesTags.innerHTML = (track.tags ?? [])
          .map((tag) => `<span class="detail-tag">${escapeHtml(tag)}</span>`)
          .join("");
      }

      function setTrackDetailVisibility(visible) {
        elements.notes.hidden = !visible;
        elements.readingLayout.classList.toggle("has-track-detail", visible);
      }

      function clearTrackSelection({ restoreFocus = false } = {}) {
        if (!activeTrackButton) {
          setTrackDetailVisibility(false);
          renderNotes(null);
          return;
        }

        const previousButton = activeTrackButton;
        previousButton.setAttribute("aria-expanded", "false");
        previousButton.closest(".track").querySelector(".track-inline-detail").hidden = true;
        activeTrackButton = null;
        setTrackDetailVisibility(false);
        renderNotes(null);
        if (restoreFocus) previousButton.focus();
      }

      function selectTrack(button, track, inlineDetail) {
        const wasActive = button === activeTrackButton;

        if (activeTrackButton) clearTrackSelection();

        if (wasActive) return;

        activeTrackButton = button;
        button.setAttribute("aria-expanded", "true");
        inlineDetail.hidden = false;
        renderNotes(track);
        setTrackDetailVisibility(true);
      }

      function buildChapters(scenario, scenarioKey) {
        clearTrackSelection();
        elements.chapterNav.innerHTML = "";
        elements.chapterList.innerHTML = "";

        scenario.chapters.forEach((chapter, chapterIndex) => {
          const chapterId = `chapter-${scenarioKey}-${chapterIndex + 1}`;
          const navLink = document.createElement("a");
          navLink.href = `#${chapterId}`;
          navLink.innerHTML = `<span>${escapeHtml(chapter.range)}</span><strong>${escapeHtml(chapter.title)}</strong>`;
          elements.chapterNav.append(navLink);

          const article = document.createElement("article");
          article.className = "chapter";
          article.id = chapterId;
          article.innerHTML = `
            <div class="chapter-main">
              <header class="chapter-head">
                <div class="chapter-title-line">
                  <h3>${escapeHtml(chapter.title)}</h3>
                  <span class="chapter-range">${escapeHtml(chapter.range)}</span>
                </div>
                <p>${escapeHtml(chapter.note)}</p>
              </header>
              <div class="tracks"></div>
            </div>
          `;

          const tracks = article.querySelector(".tracks");
          chapter.songs.forEach((track) => {
            const row = document.createElement("div");
            row.className = "track";
            row.dataset.bandCount = String(track.performers.length);
            if (track.lineupTransition) row.dataset.lineupTransition = "true";
            row.style.setProperty("--track-primary", bandColor(track.performers[0]));
            const otherCount = (track.otherMembers ?? []).length;
            const collaboration = collaborationSpec(track);
            const hasDetailMarker = Boolean(
              track.lineupTransition
                || collaboration
                || otherCount > 0
                || (track.tags ?? []).length > 0,
            );
            const tagsText = track.lineupTransition
              ? "V1 + V2 接点"
              : collaboration
              ? collaboration.short
              : otherCount > 0
                ? `其他 ${otherCount}`
                : (track.tags ?? []).length > 0
                  ? track.tags.join(" / ")
                  : "详情";
            row.innerHTML = `
              ${bandRailMarkup(track, scenario)}
              <button class="track-main" type="button" aria-expanded="false">
                <span class="track-code">${escapeHtml(track.code)}</span>
                <span class="track-title">${escapeHtml(track.title)}</span>
                <span class="track-performer">${escapeHtml(performerSummary(track.performers))}</span>
                <span class="track-more" data-default="${String(!hasDetailMarker)}">${escapeHtml(tagsText)}</span>
              </button>
              <div class="track-inline-detail" hidden>${detailMarkup(track)}</div>
            `;
            const button = row.querySelector(".track-main");
            const inlineDetail = row.querySelector(".track-inline-detail");
            button.addEventListener("click", () => selectTrack(button, track, inlineDetail));
            tracks.append(row);
          });

          elements.chapterList.append(article);
        });
      }

      function renderStatus(scenario) {
        const showStatus = scenario.status !== "scheduled";
        elements.statusPanel.hidden = !showStatus;
        if (!showStatus) return;

        elements.statusLabel.textContent = scenario.statusLabel;
        elements.statusNote.textContent = scenario.statusNote || "本地生产库未记录补充说明。";
        elements.history.innerHTML = scenario.history
          .map((item) => `<li>${escapeHtml(item)}</li>`)
          .join("");
        elements.history.hidden = scenario.history.length === 0;
      }

      function renderEmpty(scenario) {
        elements.emptyTitle.textContent = scenario.emptyTitle;
        elements.emptyBody.textContent = scenario.emptyBody;
        elements.attendees.innerHTML = scenario.attendees
          .map(
            (attendee) => `
              <div class="attendee">
                <strong>${escapeHtml(attendee.band)}</strong>
                <span>${escapeHtml(attendee.members)}</span>
              </div>
            `,
          )
          .join("");
        elements.attendees.hidden = scenario.attendees.length === 0;
      }

      function renderScenario(scenarioKey) {
        const scenario = scenarios[scenarioKey];
        activeScenarioKey = scenarioKey;
        const count = songCount(scenario);
        const [year, month, day] = scenario.date.split("-");
        let selectedButton = null;

        scenarioButtons.forEach((button) => {
          const isSelected = button.dataset.scenario === scenarioKey;
          button.setAttribute("aria-selected", String(isSelected));
          button.tabIndex = isSelected ? 0 : -1;
          if (isSelected) selectedButton = button;
        });
        elements.book.setAttribute("aria-labelledby", selectedButton?.id ?? "");
        selectedButton?.scrollIntoView({ block: "nearest", inline: "nearest" });

        elements.series.textContent = scenario.series;
        elements.title.textContent = scenario.title;
        elements.summary.textContent = scenario.summary;
        elements.references.innerHTML = scenario.references
          .map((reference) => `<span>${escapeHtml(reference)}</span>`)
          .join("");
        elements.references.hidden = scenario.references.length === 0;
        elements.dateDay.setAttribute("aria-label", `${Number(month)} 月 ${Number(day)} 日`);
        elements.dateDay.innerHTML = `
          <span>${month}</span>
          <span class="date-separator" aria-hidden="true">/</span>
          <span>${day}</span>
        `;
        elements.dateYear.innerHTML = `
          <span>${year}</span>
          <span>${escapeHtml(scenario.statusLabel)}</span>
        `;
        elements.venue.textContent = scenario.venue;
        elements.opening.textContent = scenario.opening;
        elements.start.textContent = scenario.start;
        elements.type.textContent = scenario.type;
        elements.count.textContent = count > 0 ? `${count} 曲 / ${scenario.chapters.length} 章` : "无歌单";
        elements.favorite.hidden = scenario.status === "cancelled";
        elements.favorite.setAttribute("aria-pressed", "false");
        elements.favorite.textContent = "收藏";
        elements.share.textContent = "复制链接";
        elements.source.href = scenario.source;
        elements.sampleLabel.textContent = `本地生产库只读样本 Live #${scenario.liveId}`;

        renderStatus(scenario);

        const hasSetlist = count > 0;
        elements.readingLayout.hidden = !hasSetlist;
        elements.emptyProgram.hidden = hasSetlist;

        if (hasSetlist) {
          elements.contentsSummary.textContent = scenario.contentsSummary
            ?? `${count} 曲，按 ${scenario.chapters.length} 个阅读章节编排。曲目顺序仍以数据库 absolute_order 为准。`;
          elements.programSummary.textContent = scenario.programSummary
            ?? `${count} 曲完整收录。章节只负责阅读分组，不改变原始演出顺序。`;
          renderBandLegend(scenario);
          buildChapters(scenario, scenarioKey);
        } else {
          renderEmpty(scenario);
        }

        document.title = `${scenario.title} | STAGE LIGHT 歌单`;
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set("scenario", scenarioKey);
        if (window.location.protocol !== "file:") {
          history.replaceState(null, "", currentUrl);
        }
      }

      function requestScenario(nextKey) {
        if (!nextKey || !scenarios[nextKey] || nextKey === activeScenarioKey) return;

        if (reduceMotion.matches) {
          renderScenario(nextKey);
          return;
        }

        elements.book.classList.add("is-switching");
        window.setTimeout(() => {
          renderScenario(nextKey);
          window.requestAnimationFrame(() => elements.book.classList.remove("is-switching"));
        }, 150);
      }

      scenarioButtons.forEach((button) => {
        button.id = `scenario-tab-${button.dataset.scenario}`;
        button.setAttribute("aria-controls", "book");

        button.addEventListener("click", () => {
          requestScenario(button.dataset.scenario);
        });

        button.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();

          const currentIndex = scenarioButtons.indexOf(button);
          const nextIndex = event.key === "Home"
            ? 0
            : event.key === "End"
              ? scenarioButtons.length - 1
              : (currentIndex + (event.key === "ArrowRight" ? 1 : -1) + scenarioButtons.length)
                % scenarioButtons.length;
          const nextButton = scenarioButtons[nextIndex];
          nextButton.focus();
          requestScenario(nextButton.dataset.scenario);
        });
      });

      elements.themeToggle.addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        setTheme(nextTheme, { persist: true });
      });

      elements.favorite.addEventListener("click", () => {
        const pressed = elements.favorite.getAttribute("aria-pressed") === "true";
        elements.favorite.setAttribute("aria-pressed", String(!pressed));
        elements.favorite.textContent = pressed ? "收藏" : "已收藏";
      });

      elements.notesClose.addEventListener("click", () => {
        clearTrackSelection({ restoreFocus: true });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && activeTrackButton) {
          clearTrackSelection({ restoreFocus: true });
        }
      });

      elements.share.addEventListener("click", async () => {
        const scenario = scenarios[activeScenarioKey];
        try {
          await navigator.clipboard.writeText(scenario.source);
          elements.share.textContent = "已复制";
        } catch {
          elements.share.textContent = "复制失败";
        }
        window.setTimeout(() => {
          elements.share.textContent = "复制链接";
        }, 1400);
      });

      const requestedScenario = new URL(window.location.href).searchParams.get("scenario");
      const visibleScenarioKeys = new Set(
        scenarioButtons.map((button) => button.dataset.scenario),
      );
      renderScenario(
        requestedScenario && visibleScenarioKeys.has(requestedScenario)
          ? requestedScenario
          : "regular",
      );
    </script>
  </body>
</html>
