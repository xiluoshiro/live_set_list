<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LiveSetList 演出详情复杂场景预览，展示完整歌单与参与摘录两类数据语义。"
    />
    <title>LiveSetList · 演出详情动态预览</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <a class="skip-link" href="#setlist-content">跳到歌单</a>
    <div class="page-progress" aria-hidden="true"></div>

    <header class="site-topbar">
      <a class="site-brand" href="#preview" aria-label="返回演出详情预览顶部">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span class="brand-copy">
          <strong>LiveSetList</strong>
          <small>BanG Dream! Live Archive</small>
        </span>
      </a>

      <nav class="top-nav" aria-label="主导航">
        <a class="active" href="#setlist-content">演出资料</a>
        <a href="#detail-aside">巡演资料</a>
        <a href="#detail-aside">数据统计</a>
        <a href="#detail-aside">乐队浏览</a>
      </nav>

      <button class="text-action theme-toggle" type="button" aria-label="切换为亮色主题">
        <span aria-hidden="true">◐</span>
        <span class="theme-label">亮色</span>
      </button>
    </header>

    <main id="preview">
      <section class="detail-hero" aria-labelledby="live-title">
        <div class="hero-stage">
          <div class="hero-kicker">
            <button class="back-action" type="button">返回演出列表</button>
            <span>EVENT DETAIL</span>
          </div>

          <div class="hero-heading">
            <div class="hero-title-wrap">
              <p>BanG Dream! LIVE ARCHIVE</p>
              <h1 id="live-title"></h1>
            </div>
            <a class="source-link" href="#coverage-strip">资料来源</a>
          </div>

          <div class="hero-actions" aria-label="演出操作">
            <button class="favorite-action" type="button" aria-pressed="false">收藏演出</button>
            <button class="more-action" type="button" aria-expanded="false" aria-controls="band-popover">更多操作</button>
          </div>

          <div class="hero-meta" id="hero-meta"></div>
        </div>

        <div class="coverage-strip" id="coverage-strip"></div>
      </section>

      <section class="control-dock" aria-label="预览和歌单显示设置">
        <div class="control-intro">
          <strong>探索演出记录</strong>
          <span>切换数据场景、内容范围与阅读方式</span>
        </div>

        <div class="control-cluster">
          <div class="control-group">
            <span class="control-label">数据场景</span>
            <div class="segmented scenario-toggle" role="group" aria-label="预览场景">
              <button type="button" data-scenario="full" class="active" aria-pressed="true">完整歌单</button>
              <button type="button" data-scenario="extract" aria-pressed="false">参与摘录</button>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label">内容范围</span>
            <div class="segmented scope-toggle" role="group" aria-label="内容范围"></div>
          </div>

          <div class="control-group">
            <span class="control-label">阅读方式</span>
            <div class="segmented view-toggle" role="group" aria-label="阅读方式">
              <button type="button" data-view="timeline" class="active" aria-pressed="true">舞台流程</button>
              <button type="button" data-view="table" aria-pressed="false">数据表格</button>
            </div>
          </div>
        </div>
      </section>

      <div class="detail-layout">
        <section class="setlist-content" id="setlist-content" aria-live="polite"></section>
        <aside class="detail-aside" id="detail-aside" aria-label="歌单概览与区段索引"></aside>
      </div>
    </main>

    <div class="drawer-mask" id="drawer-mask" hidden>
      <aside
        class="performance-drawer"
        id="performance-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
      >
        <div class="drawer-head">
          <div>
            <span class="drawer-code" id="drawer-code"></span>
            <h2 id="drawer-title"></h2>
          </div>
          <button class="drawer-close" type="button" aria-label="关闭出演详情">关闭</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </aside>
    </div>

    <div class="band-popover" id="band-popover" role="dialog" aria-modal="false" hidden></div>

    <script src="./preview.js"></script>
  </body>
</html>
